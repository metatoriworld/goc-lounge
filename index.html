<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOC LOUNGE | Gallery</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f4f4f6;font-family:system-ui,'Noto Sans KR',sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1280px;margin:auto;padding:0 24px}header{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20}.brand{font-size:27px;font-weight:800;letter-spacing:.2em}.brand small{display:block;font-size:9px;letter-spacing:.18em;color:#aaa}header a:last-child{border:1px solid #ffffff30;padding:12px 16px;font-size:12px}.hero{padding:80px 0 45px}.eyebrow{color:#c6a17b;font-size:11px;letter-spacing:.3em}.hero h1{font-size:clamp(50px,9vw,110px);line-height:1;margin:20px 0 25px;letter-spacing:-.065em}.hero h1 span{color:#565a64}.hero p{font-size:14px;line-height:1.9;color:#b0b3bc}.line{height:1px;background:linear-gradient(90deg,#c9a27c,transparent);margin-top:45px}.meta{display:flex;justify-content:space-between;color:#9396a0;font-size:11px;letter-spacing:.15em;margin:24px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:100px}.tile{position:relative;border:0;padding:0;background:#15171d;aspect-ratio:1.45;overflow:hidden;cursor:pointer;color:white;text-align:left}.tile img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.tile:hover img{transform:scale(1.04)}.tile:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#000a)}.num,.cap{position:absolute;z-index:1;left:22px}.num{top:20px;font-size:11px}.cap{bottom:24px;font-size:23px}.cap small{display:block;font-size:10px;color:#ddd;letter-spacing:.15em;margin-top:8px}footer{border-top:1px solid #ffffff20;padding:35px 0;color:#8a8c94;font-size:11px;display:flex;justify-content:space-between}.viewer{display:none;position:fixed;inset:0;background:#050608f5;z-index:9;align-items:center;justify-content:center;flex-direction:column;padding:70px 55px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:78vh;object-fit:contain}.viewer button{position:absolute;background:#17181b;color:white;border:1px solid #ffffff50;width:45px;height:45px;font-size:25px;cursor:pointer}.close{right:20px;top:20px}.prev{left:8px;top:50%}.next{right:8px;top:50%}.viewer p{font-size:13px;color:#ddd}@media(max-width:700px){header{height:70px}.brand{font-size:21px}.hero{padding:55px 0 30px}.grid{grid-template-columns:1fr;gap:10px;margin-bottom:60px}.tile{aspect-ratio:1.3}.cap{font-size:19px}footer{flex-direction:column;gap:10px}.viewer{padding:70px 10px}.prev,.next{top:auto;bottom:18px}.prev{left:calc(50% - 55px)}.next{right:calc(50% - 55px)}}
</style></head><body><div class="wrap"><header><a class="brand" href="./">GOC<small>GUARDIANS OF CONTINUITY</small></a><a href="https://metatoriworld.github.io/goc-dashboard/">GOC HOME</a></header><section class="hero"><div class="eyebrow">GUARDIANS OF CONTINUITY / VISUAL ARCHIVE</div><h1>THE <span>GALLERY.</span></h1><p>함께 잇는 가치, 함께 남기는 장면.<br>GOC의 순간들을 하나의 아카이브로 기록합니다.</p><div class="line"></div></section><div class="meta"><span>VISUAL COLLECTION · 2026</span><span>PHOTOS 04</span></div><main class="grid" id="gallery"></main></div><footer class="wrap"><span>© GOC · GUARDIANS OF CONTINUITY</span><span>함께 잇는 가치</span></footer><div class="viewer" id="viewer" role="dialog" aria-modal="true"><button class="close" id="close" aria-label="닫기">×</button><button class="prev" id="prev" aria-label="이전">‹</button><img id="expanded" alt=""><p id="title"></p><button class="next" id="next" aria-label="다음">›</button></div><script>
const pics=[['gallery/images/goc-01.webp','불꽃의 순간','SUNSET COLLECTION'],['gallery/images/goc-02.webp','노을빛 드라이브','EVENING COLLECTION'],['gallery/images/goc-03.webp','오로라의 밤','NIGHT COLLECTION'],['gallery/images/goc-04.webp','해안의 황혼','COAST COLLECTION']];const gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer'),expanded=document.getElementById('expanded'),title=document.getElementById('title');let current=0;gallery.innerHTML=pics.map((p,i)=>'<button class="tile" data-i="'+i+'"><img src="'+p[0]+'" alt="'+p[1]+'" loading="lazy"><span class="num">0'+(i+1)+' / 04</span><span class="cap">'+p[1]+'<small>GOC · '+p[2]+'</small></span></button>').join('');function show(i){current=(i+pics.length)%pics.length;expanded.src=pics[current][0];expanded.alt=pics[current][1];title.textContent=(current+1)+' / 04 · '+pics[current][1]}function openViewer(i){show(i);viewer.classList.add('open');document.body.style.overflow='hidden'}function closeViewer(){viewer.classList.remove('open');document.body.style.overflow=''}gallery.addEventListener('click',e=>{const b=e.target.closest('.tile');if(b)openViewer(+b.dataset.i)});document.getElementById('close').onclick=closeViewer;document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});let touchX=0;viewer.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});viewer.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>50)show(current+(d<0?1:-1))},{passive:true});
</script></body></html>
